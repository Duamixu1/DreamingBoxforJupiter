<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>布景工作台</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4efe6; --panel: #fbf8f2; --ink: #3b2f25; --dim: #8a7a68; --line: #e3d9c8;
    --gold: #b8923f; --ok: #5f8a5a; --run: #b8923f; --bad: #b5523b; --chip: #efe7d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  .stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 20px 8px; }
  header h1 { margin: 0; font-size: 18px; }
  header .status { color: var(--dim); font-size: 13px; }
  #view { position: relative; margin: 0 20px; border-radius: 12px; overflow: hidden; background: #ddd2bf; cursor: grab; touch-action: none; }
  #view.dragging { cursor: grabbing; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #view .hint { position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #0006; pointer-events: none; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 20px 16px; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group label { color: var(--dim); font-size: 12px; margin-right: 2px; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=range] { width: 260px; accent-color: var(--gold); }
  #pct { width: 44px; color: var(--dim); font-variant-numeric: tabular-nums; }

  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 30px; }
  aside h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 18px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .card.drop { border-color: var(--gold); box-shadow: 0 0 0 3px #b8923f33; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .card .thumb { width: 40px; height: 52px; border-radius: 6px; background: var(--chip) center/cover no-repeat; flex: none; }
  .card .name { font-weight: 600; }
  .card .meta { color: var(--dim); font-size: 12px; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--dim); margin-left: 6px; vertical-align: 1px; }
  .chip.ok { background: #e3eedf; color: var(--ok); }
  .chip.run { background: #f4ead2; color: var(--run); }
  .chip.bad { background: #f5e1da; color: var(--bad); }
  .card .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card .actions button { font-size: 12px; padding: 3px 8px; }
  .bar { height: 5px; border-radius: 3px; background: var(--chip); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .4s; }
  .bar.indef i { width: 35% !important; animation: slide 1.2s linear infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .msg { font-size: 12px; color: var(--dim); margin-top: 4px; word-break: break-all; }
  .msg.bad { color: var(--bad); }
  .note { font-size: 12px; color: var(--dim); background: var(--chip); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  .viewer { position: fixed; inset: 0; z-index: 50; display: none; grid-template-columns: 1fr 300px; background: #2b241ee6; backdrop-filter: blur(4px); }
  .viewer.open { display: grid; }
  .viewer .cv { position: relative; margin: 20px 0 20px 20px; border-radius: 14px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #f6efe2, #d8ccb6); cursor: grab; touch-action: none; }
  .viewer .cv.dragging { cursor: grabbing; }
  .viewer .cv canvas { display: block; width: 100%; height: 100%; }
  .viewer .cv .hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #6b5c4c; pointer-events: none; }
  .viewer .cv .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #6b5c4c; font-size: 14px; pointer-events: none; }
  .viewer .cv .loading[hidden], #view .hint[hidden] { display: none; }
  .viewer .side { margin: 20px; background: var(--panel); border-radius: 14px; padding: 16px; overflow-y: auto; }
  .viewer .side h3 { margin: 0 0 4px; font-size: 17px; }
  .viewer .side .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .viewer .side .stat { font-size: 12px; color: var(--dim); line-height: 1.8; }
  .viewer .side img { width: 100%; border-radius: 8px; margin-top: 8px; background: var(--chip); }
  .viewer .side label.sw { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .viewer .side input[type=range] { width: 100%; }
  .tabs { display: flex; gap: 4px; margin-left: 12px; }
  .tabs button { border-radius: 99px; }
  #bench { display: none; margin: 0 20px 12px; }
  body.cmp #bench { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; height: calc(100vh - 64px); }
  body.cmp #view, body.cmp .stage > .controls { display: none; }
  .wb-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
  .wb-wins, .wb-steps { display: flex; gap: 4px; }
  .wb-steps button { font-weight: 600; }
  .wb-save { color: var(--dim); font-size: 12px; margin-left: auto; }
  .wb-body { display: grid; grid-template-columns: 1fr 280px; gap: 14px; min-height: 0; }
  .wb-main { min-height: 0; display: flex; flex-direction: column; background: #e9e0d0; border-radius: 12px; overflow: hidden; }
  .wb-side { background: #fff; border-radius: 12px; padding: 14px; overflow-y: auto; font-size: 13px; }
  .wb-side h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .wb-side .field { margin: 10px 0; }
  .wb-side .field > label { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .wb-side input[type=range], .wb-side input:not([type]), .wb-side textarea { width: 100%; font: inherit; }
  .wb-side input:not([type]), .wb-side textarea { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  .wb-side .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .wb-side .seg button { font-size: 12px; padding: 4px 8px; }
  .wb-side .info { font-size: 12px; line-height: 1.7; background: var(--chip); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
  .wb-side .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .wb-side .row button { font-size: 12px; }
  .wb-side label.sw { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
  .wb-side .legend div { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .wb-side .legend i, .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .sub { color: var(--dim); font-size: 12px; }
  .wb-device { flex: 1; display: grid; place-items: center; min-height: 0; padding: 10px; }
  .wb-device.big { height: 100%; }
  .bezel { background: linear-gradient(135deg, #6b4a32, #3e2a1c); border-radius: 10px; display: grid; place-items: center; box-shadow: 0 6px 18px #0003; }
  .screen { background: #111; overflow: hidden; position: relative; cursor: grab; touch-action: none; }
  .screen canvas { display: block; }
  .cv-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; background: #f6f0e4; font-size: 12px; }
  .cv-tools .sep { width: 1px; height: 18px; background: var(--line); }
  .cv-tools .hint { color: var(--dim); flex-basis: 100%; }
  .cv-tools label { display: flex; align-items: center; gap: 4px; color: var(--dim); }
  .cv-wrap { flex: 1; min-height: 0; position: relative; }
  .cv-wrap canvas { position: absolute; inset: 0; touch-action: none; }
  .wb-bottom { min-height: 0; }
  .wb-strip { display: flex; gap: 16px; justify-content: center; height: 170px; }
  .wb-strip .mini { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; color: var(--dim); width: 120px; height: 100%; }
  .wb-strip .mini .wb-device { padding: 0; width: 100%; }
  .wb-strip .mini.on span { color: var(--ink); font-weight: 600; }
  .wb-strip .mini .screen { cursor: pointer; }
  .wb-gallery-title { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .wb-gallery { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .gcard { flex: none; width: 150px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 12px; cursor: pointer; }
  .gcard.on { border-color: var(--gold); box-shadow: 0 0 0 2px #b8923f44; }
  .gthumb { height: 110px; display: grid; place-items: center; border-radius: 6px; overflow: hidden;
    background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 14px 14px; }
  .gthumb canvas { max-width: 100%; max-height: 110px; }
  .gname { font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 5px; }
  .gmeta, .gstat { color: var(--dim); }
  .gstat.run { color: var(--run); } .gstat.ok { color: var(--ok); } .gstat.bad { color: var(--bad); }
  .gact { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .gact button { font-size: 11px; padding: 2px 6px; }
  .pipe .thumbs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .pipe figure { margin: 0; width: 54px; text-align: center; font-size: 10px; color: var(--dim); }
  .pipe img { width: 54px; height: 72px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .pipe .gate { margin-top: 8px; padding: 8px; background: #fff7e6; border: 1px solid var(--gold); border-radius: 8px; font-size: 12px; }
  .pipe .gate div { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .pipe .gate button { font-size: 11px; padding: 3px 7px; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <header>
      <h1><a href="/" style="color:inherit;text-decoration:none" title="回到首页">DreamingBox</a> · 布景工作台</h1>
      <div class="tabs"><button data-tab="scene" class="on">四扇窗布景</button><button data-tab="cmp">精修工作台</button></div>
      <span class="status" id="status">读取中…</span>
    </header>
    <div id="bench"></div>
    <div id="view"><span class="hint">拖动 / 双指左右滑动 看其他窗 · 滚轮也行</span></div>
    <div class="controls">
      <div class="group"><label>进度</label><input id="progress" type="range" min="0" max="1000" value="120"><span id="pct"></span><button id="play">▶ 播放</button></div>
      <div class="group"><label>视野</label><button data-zoom="1" class="on">一扇</button><button data-zoom="2">两扇</button><button data-zoom="4">全部</button></div>
      <div class="group"><label>立体</label><button id="wiggle">立体摇摆</button></div>
      <div class="group"><label>跳到</label><button data-go="0">晨</button><button data-go="1">昼</button><button data-go="2">暮</button><button data-go="3">夜</button></div>
    </div>
  </section>
  <aside id="slots"></aside>
</div>
<div class="viewer" id="viewer">
  <div class="cv" id="vcv"><div class="loading" id="vload">载入中…</div><span class="hint">拖动旋转 · 滚轮缩放 · 右键或 Shift+拖动平移 · Esc 关闭</span></div>
  <div class="side">
    <h3 id="vname"></h3>
    <div class="stat" id="vmeta"></div>
    <div class="row"><button id="vproc" class="on">处理后（盒子里用的）</button><button id="vraw">Tripo 原始</button></div>
    <label class="sw"><input type="checkbox" id="vspin" checked> 自动旋转</label>
    <label class="sw"><input type="checkbox" id="vwig"> 立体摇摆（模拟裸眼屏左右看）</label>
    <div class="stat">摇摆幅度</div><input type="range" id="vamp" min="1" max="15" value="5">
    <div class="row"><button data-vview="front">正面</button><button data-vview="side">侧面</button><button data-vview="q">斜 45°</button></div>
    <div class="stat" id="vstats"></div>
    <img id="vsrc" alt="" hidden>
    <div class="row"><button id="vclose">关闭</button></div>
  </div>
</div>
<script type="module" src="src/studio.js"></script>
</body>
</html>
